<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Tsotne Ivanashvili: builder  ·  learner  ·  shipping every day">
  <title>Tsotne Ivanashvili</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#140b24"/>
    </linearGradient>
    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2400 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txt2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2400 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <style>
    .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    .b3 { animation-duration: 11s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(120px, 40px) scale(1.25); }
      100% { transform: translate(-80px, -30px) scale(0.9); }
    }
    .star { fill: #fff; animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
    .name { font: 800 76px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; opacity: 0; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .tag { font: 500 24px ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace; letter-spacing: 3px; fill: #c9d1d9; opacity: 0; animation: rise 1.2s cubic-bezier(.2,.8,.2,1) .8s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.4s ease-out 1.2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .name, .tag { opacity: 1; }
      .line { stroke-dashoffset: 0; }
      .scan { display: none; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle class="blob" cx="220" cy="90" r="130" fill="#22d3ee"/>
      <circle class="blob b2" cx="980" cy="230" r="150" fill="#f472b6"/>
      <circle class="blob b3" cx="620" cy="300" r="120" fill="#a78bfa"/>
    </g>
    <circle class="star" cx="516" cy="93" r="0.6" style="animation-delay:-0.00s"/><circle class="star" cx="1138" cy="291" r="1.1" style="animation-delay:-0.37s"/><circle class="star" cx="240" cy="281" r="1.6" style="animation-delay:-0.74s"/><circle class="star" cx="462" cy="127" r="0.6" style="animation-delay:-1.11s"/><circle class="star" cx="396" cy="277" r="1.1" style="animation-delay:-1.48s"/><circle class="star" cx="1050" cy="27" r="1.6" style="animation-delay:-1.85s"/><circle class="star" cx="280" cy="145" r="0.6" style="animation-delay:-2.22s"/><circle class="star" cx="1046" cy="247" r="1.1" style="animation-delay:-2.59s"/><circle class="star" cx="900" cy="205" r="1.6" style="animation-delay:-2.96s"/><circle class="star" cx="706" cy="147" r="0.6" style="animation-delay:-3.33s"/><circle class="star" cx="512" cy="201" r="1.1" style="animation-delay:-3.70s"/><circle class="star" cx="254" cy="47" r="1.6" style="animation-delay:-0.07s"/><circle class="star" cx="860" cy="133" r="0.6" style="animation-delay:-0.44s"/><circle class="star" cx="506" cy="267" r="1.1" style="animation-delay:-0.81s"/><circle class="star" cx="520" cy="129" r="1.6" style="animation-delay:-1.18s"/><circle class="star" cx="326" cy="39" r="0.6" style="animation-delay:-1.55s"/><circle class="star" cx="196" cy="253" r="1.1" style="animation-delay:-1.92s"/><circle class="star" cx="738" cy="259" r="1.6" style="animation-delay:-2.29s"/><circle class="star" cx="368" cy="249" r="0.6" style="animation-delay:-2.66s"/><circle class="star" cx="286" cy="31" r="1.1" style="animation-delay:-3.03s"/><circle class="star" cx="684" cy="53" r="1.6" style="animation-delay:-3.40s"/><circle class="star" cx="714" cy="315" r="0.6" style="animation-delay:-3.77s"/><circle class="star" cx="632" cy="49" r="1.1" style="animation-delay:-0.14s"/><circle class="star" cx="438" cy="151" r="1.6" style="animation-delay:-0.51s"/><circle class="star" cx="436" cy="301" r="0.6" style="animation-delay:-0.88s"/><circle class="star" cx="1074" cy="115" r="1.1" style="animation-delay:-1.25s"/><circle class="star" cx="224" cy="169" r="1.6" style="animation-delay:-1.62s"/><circle class="star" cx="286" cy="15" r="0.6" style="animation-delay:-1.99s"/><circle class="star" cx="652" cy="101" r="1.1" style="animation-delay:-2.36s"/><circle class="star" cx="922" cy="235" r="1.6" style="animation-delay:-2.73s"/><circle class="star" cx="632" cy="225" r="0.6" style="animation-delay:-3.10s"/><circle class="star" cx="118" cy="7" r="1.1" style="animation-delay:-3.47s"/><circle class="star" cx="148" cy="29" r="1.6" style="animation-delay:-3.84s"/><circle class="star" cx="258" cy="99" r="0.6" style="animation-delay:-0.21s"/><circle class="star" cx="1120" cy="281" r="1.1" style="animation-delay:-0.58s"/><circle class="star" cx="958" cy="127" r="1.6" style="animation-delay:-0.95s"/><circle class="star" cx="1036" cy="21" r="0.6" style="animation-delay:-1.32s"/><circle class="star" cx="202" cy="27" r="1.1" style="animation-delay:-1.69s"/><circle class="star" cx="408" cy="145" r="1.6" style="animation-delay:-2.06s"/><circle class="star" cx="838" cy="119" r="0.6" style="animation-delay:-2.43s"/><circle class="star" cx="340" cy="205" r="1.1" style="animation-delay:-2.80s"/><circle class="star" cx="818" cy="275" r="1.6" style="animation-delay:-3.17s"/><circle class="star" cx="1104" cy="9" r="0.6" style="animation-delay:-3.54s"/><circle class="star" cx="446" cy="111" r="1.1" style="animation-delay:-3.91s"/><circle class="star" cx="316" cy="197" r="1.6" style="animation-delay:-0.28s"/><circle class="star" cx="1114" cy="139" r="0.6" style="animation-delay:-0.65s"/>
    <rect class="scan" x="0" y="0" width="1200" height="40" fill="#ffffff" opacity="0.025"/>
    <g filter="url(#glow)">
      <text class="name" x="50%" y="165" text-anchor="middle" fill="url(#txt)">Tsotne Ivanashvili</text>
    </g>
    <path class="line" d="M340.0 195 H860.0" stroke="url(#txt2)" stroke-width="3" stroke-linecap="round"/>
    <text class="tag" x="50%" y="240" text-anchor="middle">builder  ·  learner  ·  shipping every day</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="url(#txt)" stroke-opacity="0.5" stroke-width="2"/>
</svg>
